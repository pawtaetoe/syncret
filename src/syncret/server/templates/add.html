{% extends "base.html" %}
{% block title %}Add{% endblock %}
{% block main %}
<h1>Add a skill</h1>
{% if error %}<p class="notice bad" role="alert">{{ error | shown }}</p>{% endif %}
<form method="post" action="/add" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="source">GitHub or skills.sh link, or a folder on the server</label>
  <input type="text" id="source" name="source" value="{{ source }}" placeholder="https://github.com/owner/repo/tree/main/skills/name" autocomplete="off" spellcheck="false" required>
  {% if choices %}
  <fieldset><legend>Skills in that repo</legend>
    {% for name in choices %}<label class="check"><input type="checkbox" name="skills" value="{{ name }}"> {{ name | shown }}</label>{% endfor %}
  </fieldset>
  {% endif %}
  <fieldset><legend>Ship to</legend>
    <label class="check"><input type="checkbox" name="targets" value="local" checked> Local agents (Claude Code, Copilot, Zed)</label>
    <label class="check"><input type="checkbox" name="targets" value="account"> Claude account (zip upload)</label>
  </fieldset>
  <div class="form-actions"><button type="submit" class="primary">Add</button></div>
</form>
{% endblock %}
