[project]
name = "syncret"
version = "0.1.0"
description = "Vet agent skills for risky content and find duplicates and overlaps across skill folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pawtaetoe" }]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]
keywords = ["agent-skills", "claude-code", "security", "prompt-injection", "linter", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]

[project.urls]
Repository = "https://github.com/pawtaetoe/syncret"
Issues = "https://github.com/pawtaetoe/syncret/issues"

[project.scripts]
syncret = "syncret.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=2.11.0"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "anthropic>=2.11.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
