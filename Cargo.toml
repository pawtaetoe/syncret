[workspace]
members = ["crates/core", "crates/store", "crates/kinds", "crates/engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pawtaetoe/syncret"

[workspace.dependencies]
syncret-core = { path = "crates/core" }
syncret-store = { path = "crates/store" }
syncret-kinds = { path = "crates/kinds" }
syncret-engine = { path = "crates/engine" }
async-trait = "0.1.92"
blake3 = "1.8.7"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
globset = "0.4.21"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
toml = "1.2.1"
proptest = "1.12.0"
tempfile = "3.27.0"
